name: KilnApp
options:
  bundleIdPrefix: com.binkkiln
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: "VULUT953K6"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"

targets:
  KilnApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: KilnApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.binkkiln.KilnApp
        PRODUCT_NAME: Kiln
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Kiln connects to your kiln controller on your local network to monitor and control firings."
        INFOPLIST_KEY_NSCameraUsageDescription: "Kiln uses the camera to scan QR codes for server setup."
        TARGETED_DEVICE_FAMILY: "1,2"
